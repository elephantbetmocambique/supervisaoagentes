<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentes — SupervisãoAgentes</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app"></div>

<!-- MODAL AGENTE -->
<div class="modal-backdrop" id="modal-agente">
  <div class="modal modal--lg">
    <div class="modal__header">
      <span class="modal__title" id="modal-agente-title">Novo Agente</span>
      <button class="modal__close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal__body">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
        <div class="avatar-preview" id="avatar-preview" onclick="document.getElementById('avatar-file').click()">?
          <input type="file" id="avatar-file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;" onchange="previewAvatar(this)">
        </div>
        <div>
          <div style="font-size:0.85rem;font-weight:500;margin-bottom:4px;">Foto do Agente</div>
          <div style="font-size:0.75rem;color:var(--text-muted);">Clique para escolher uma foto</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nome Completo *</label>
          <input type="text" id="ag-nome" class="form-control" placeholder="Nome do agente">
        </div>
        <div class="form-group">
          <label class="form-label">Bilhete de Identidade</label>
          <input type="text" id="ag-bi" class="form-control" placeholder="Nº do BI">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Telefone</label>
          <input type="tel" id="ag-telefone" class="form-control" placeholder="+258 8X XXX XXXX">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="ag-email" class="form-control" placeholder="email@exemplo.com">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Zona / Área</label>
          <input type="text" id="ag-zona" class="form-control" placeholder="Ex: Matola, Maputo Centro">
        </div>
        <div class="form-group">
          <label class="form-label">Supervisor</label>
          <select id="ag-supervisor" class="form-control">
            <option value="">— Selecionar supervisor —</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Data de Início</label>
          <input type="date" id="ag-data-inicio" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select id="ag-status" class="form-control">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Observações</label>
        <textarea id="ag-obs" class="form-control" rows="2" placeholder="Notas adicionais..."></textarea>
      </div>
    </div>
    <div class="modal__actions">
      <button class="btn btn--ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn--primary" id="btn-save-agente" onclick="saveAgente()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
let allAgentes = [], page = 1, editingId = null, avatarBlob = null;

(async () => {
  const ok = await Auth.init();
  if (!ok) { window.location.href = '../index.html'; return; }
  renderLayout('nav-agentes', 'Agentes');

  // Add button for admin
  if (Auth.isAdmin()) {
    document.getElementById('topbar-actions').innerHTML = `
      <button class="btn btn--primary" onclick="openModal()">+ Novo Agente</button>`;
  }

  await loadAgentes();
  await loadSupervisores();
})();

async function loadAgentes() {
  UI.loading(true);
  try {
    let query = supabase.from('agentes')
      .select('*, profiles(full_name)')
      .order('nome');
    if (!Auth.isAdmin()) {
      query = query.eq('supervisor_id', Auth.currentUser.id);
    }
    const { data, error } = await query;
    if (error) throw error;
    allAgentes = data || [];
    renderAgentes();
  } catch(e) {
    UI.toast('Erro ao carregar agentes: ' + e.message, 'error');
  } finally {
    UI.loading(false);
  }
}

async function loadSupervisores() {
  const { data } = await supabase.from('profiles').select('id, full_name').eq('role', 'supervisor');
  const sel = document.getElementById('ag-supervisor');
  (data || []).forEach(s => sel.innerHTML += `<option value="${s.id}">${s.full_name}</option>`);
}

function renderAgentes() {
  const search = document.getElementById('search-input')?.value.toLowerCase() || '';
  const statusFilter = document.getElementById('status-filter')?.value || '';
  const supFilter = document.getElementById('sup-filter')?.value || '';

  let filtered = allAgentes.filter(a => {
    const matchSearch = !search || a.nome?.toLowerCase().includes(search) || a.telefone?.includes(search) || a.zona?.toLowerCase().includes(search);
    const matchStatus = !statusFilter || a.status === statusFilter;
    const matchSup = !supFilter || a.supervisor_id === supFilter;
    return matchSearch && matchStatus && matchSup;
  });

  const paginated = UI.paginate(filtered, page, 15);
  const container = document.getElementById('agentes-table-body');
  const paginationEl = document.getElementById('pagination');

  if (!filtered.length) {
    container.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-state__icon">👤</div><div class="empty-state__title">Nenhum agente encontrado</div></div></td></tr>`;
    paginationEl.innerHTML = '';
    return;
  }

  container.innerHTML = paginated.items.map(a => `
    <tr>
      <td>
        <div class="table-agent">
          <div class="table-avatar">${a.foto_url ? `<img src="${a.foto_url}">` : UI.initials(a.nome)}</div>
          <div>
            <div class="table-name">${a.nome}</div>
            <div class="table-sub">${a.zona || '—'}</div>
          </div>
        </div>
      </td>
      <td>${a.telefone || '—'}</td>
      <td>${a.bi || '—'}</td>
      <td>${a.profiles?.full_name || '—'}</td>
      <td>${UI.formatDate(a.data_inicio)}</td>
      <td>${UI.statusBadge(a.status)}</td>
      <td>
        <div style="display:flex;gap:6px;">
          <a href="agente-detalhe.html?id=${a.id}" class="btn btn--ghost btn--sm">Ver</a>
          ${Auth.isAdmin() ? `<button class="btn btn--ghost btn--sm" onclick="editAgente('${a.id}')">✏</button>
          <button class="btn btn--danger btn--sm" onclick="deleteAgente('${a.id}')">🗑</button>` : ''}
        </div>
      </td>
    </tr>`).join('');

  UI.renderPagination(paginationEl, page, paginated.pages, p => { page = p; renderAgentes(); });
}

function buildPage() {
  document.getElementById('page-content').innerHTML = `
    <div class="filters-row">
      <div class="search-box" style="flex:1;max-width:340px;">
        <span class="search-box__icon">🔍</span>
        <input type="text" id="search-input" class="form-control" placeholder="Pesquisar agente, zona..." oninput="page=1;renderAgentes()">
      </div>
      <select class="form-control" id="status-filter" style="width:140px;" onchange="page=1;renderAgentes()">
        <option value="">Todos estados</option>
        <option value="ativo">Ativo</option>
        <option value="inativo">Inativo</option>
      </select>
      ${Auth.isAdmin() ? `<select class="form-control" id="sup-filter" style="width:200px;" onchange="page=1;renderAgentes()">
        <option value="">Todos supervisores</option>
      </select>` : ''}
      ${Auth.isAdmin() ? `<button class="btn btn--ghost btn--sm" onclick="exportAgentes()">⬇ Exportar</button>` : ''}
    </div>
    <div class="card">
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>Agente</th>
            <th>Telefone</th>
            <th>BI</th>
            <th>Supervisor</th>
            <th>Início</th>
            <th>Estado</th>
            <th>Ações</th>
          </tr></thead>
          <tbody id="agentes-table-body"></tbody>
        </table>
      </div>
      <div id="pagination" style="padding:0 16px;"></div>
    </div>`;

  renderAgentes();

  // Populate supervisor filter
  if (Auth.isAdmin()) {
    const supFilter = document.getElementById('sup-filter');
    const supervisores = [...new Set(allAgentes.map(a => a.supervisor_id).filter(Boolean))];
    allAgentes.filter(a => a.supervisor_id).forEach(a => {
      if (!document.querySelector(`#sup-filter option[value="${a.supervisor_id}"]`)) {
        supFilter.innerHTML += `<option value="${a.supervisor_id}">${a.profiles?.full_name || a.supervisor_id}</option>`;
      }
    });
  }
}

// Wait for renderLayout then build page
const observer = new MutationObserver(() => {
  if (document.getElementById('page-content')) {
    observer.disconnect();
    buildPage();
  }
});
observer.observe(document.getElementById('app'), { childList: true, subtree: true });

function openModal(id = null) {
  editingId = id;
  avatarBlob = null;
  document.getElementById('modal-agente-title').textContent = id ? 'Editar Agente' : 'Novo Agente';
  ['ag-nome','ag-bi','ag-telefone','ag-email','ag-zona','ag-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ag-status').value = 'ativo';
  document.getElementById('ag-data-inicio').value = '';
  document.getElementById('ag-supervisor').value = '';
  document.getElementById('avatar-preview').innerHTML = '?<input type="file" id="avatar-file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;" onchange="previewAvatar(this)">';

  if (id) {
    const a = allAgentes.find(x => x.id === id);
    if (a) {
      document.getElementById('ag-nome').value = a.nome || '';
      document.getElementById('ag-bi').value = a.bi || '';
      document.getElementById('ag-telefone').value = a.telefone || '';
      document.getElementById('ag-email').value = a.email || '';
      document.getElementById('ag-zona').value = a.zona || '';
      document.getElementById('ag-obs').value = a.observacoes || '';
      document.getElementById('ag-status').value = a.status || 'ativo';
      document.getElementById('ag-data-inicio').value = a.data_inicio || '';
      document.getElementById('ag-supervisor').value = a.supervisor_id || '';
      if (a.foto_url) {
        document.getElementById('avatar-preview').innerHTML = `<img src="${a.foto_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
          <input type="file" id="avatar-file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;" onchange="previewAvatar(this)">`;
      }
    }
  }
  document.getElementById('modal-agente').classList.add('active');
}

function closeModal() { document.getElementById('modal-agente').classList.remove('active'); }

function previewAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  avatarBlob = file;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('avatar-preview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
      <input type="file" id="avatar-file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;" onchange="previewAvatar(this)">`;
  };
  reader.readAsDataURL(file);
}

async function saveAgente() {
  const nome = document.getElementById('ag-nome').value.trim();
  if (!nome) { UI.toast('O nome é obrigatório', 'warning'); return; }

  const btn = document.getElementById('btn-save-agente');
  btn.disabled = true; btn.textContent = 'A guardar...';

  try {
    let foto_url = editingId ? allAgentes.find(x => x.id === editingId)?.foto_url : null;

    if (avatarBlob) {
      const ext = avatarBlob.name.split('.').pop();
      const path = `agentes/${Date.now()}.${ext}`;
      const { error: upErr } = await supabase.storage.from('fotos').upload(path, avatarBlob, { upsert: true });
      if (!upErr) {
        const { data: urlData } = supabase.storage.from('fotos').getPublicUrl(path);
        foto_url = urlData.publicUrl;
      }
    }

    const payload = {
      nome,
      bi: document.getElementById('ag-bi').value || null,
      telefone: document.getElementById('ag-telefone').value || null,
      email: document.getElementById('ag-email').value || null,
      zona: document.getElementById('ag-zona').value || null,
      observacoes: document.getElementById('ag-obs').value || null,
      status: document.getElementById('ag-status').value,
      data_inicio: document.getElementById('ag-data-inicio').value || null,
      supervisor_id: document.getElementById('ag-supervisor').value || null,
      foto_url,
    };

    let error;
    if (editingId) {
      ({ error } = await supabase.from('agentes').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('agentes').insert(payload));
    }
    if (error) throw error;

    UI.toast(editingId ? 'Agente atualizado!' : 'Agente criado!', 'success');
    closeModal();
    await loadAgentes();
    buildPage();
  } catch(e) {
    UI.toast('Erro: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

function editAgente(id) { openModal(id); }

async function deleteAgente(id) {
  const ok = await UI.confirm('Eliminar agente', 'Esta acção não pode ser revertida. Confirma?');
  if (!ok) return;
  const { error } = await supabase.from('agentes').delete().eq('id', id);
  if (error) { UI.toast('Erro: ' + error.message, 'error'); return; }
  UI.toast('Agente eliminado.', 'info');
  await loadAgentes();
  buildPage();
}

function exportAgentes() {
  const rows = allAgentes.map(a => ({
    Nome: a.nome, BI: a.bi || '', Telefone: a.telefone || '',
    Email: a.email || '', Zona: a.zona || '',
    Supervisor: a.profiles?.full_name || '',
    Estado: a.status, Início: UI.formatDate(a.data_inicio)
  }));
  exportToCSV(rows, 'agentes.csv');
}
</script>
</body>
</html>
