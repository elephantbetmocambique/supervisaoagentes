<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img class="lightbox__img" id="lightbox-img" src="">
  <button class="lightbox__close" onclick="closeLightbox()">✕</button>
  <div id="lightbox-info" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:8px 18px;border-radius:8px;font-size:0.85rem;"></div>
</div>

<script>
const SUPABASE_URL = 'https://udmlzpvpsllitrhxejvj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkbWx6cHZwc2xsaXRyaHhlanZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjAyMzEsImV4cCI6MjA5NjQ5NjIzMX0.YK8IxVwt2-cqXRV1nGHLNsHZsvSflcTb1tpUY2dJ0pQ';
const APP_VERSION = '1.0.0';
const APP_NAME = 'SupervisãoAgentes';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
let allPhotos = [], page = 1;

(async () => {
  const ok = await Auth.init();
  if (!ok) { window.location.href = '../index.html'; return; }
  renderLayout('nav-fotos', 'Galeria de Fotos');
  await loadPhotos();
})();

async function loadPhotos() {
  UI.loading(true);
  try {
    let query = Auth.sb().from('auditorias')
      .select('id, data_visita, fotos, agentes(nome), profiles(full_name)')
      .not('fotos', 'is', null)
      .order('created_at', { ascending: false });

    if (!Auth.isAdmin()) query = query.eq('supervisor_id', Auth.currentUser.id);

    const { data, error } = await query;
    if (error) throw error;

    // Flatten fotos
    allPhotos = [];
    (data || []).forEach(a => {
      (a.fotos || []).forEach(url => {
        allPhotos.push({ url, agente: a.agentes?.nome, supervisor: a.profiles?.full_name, data: a.data_visita, auditoria_id: a.id });
      });
    });

    renderGallery();
  } catch(e) {
    UI.toast('Erro: ' + e.message, 'error');
  } finally {
    UI.loading(false);
  }
}

function renderGallery() {
  const el = document.getElementById('page-content');
  if (!el) return;

  const search = document.getElementById('foto-search')?.value?.toLowerCase() || '';
  const filtered = allPhotos.filter(p => !search || p.agente?.toLowerCase().includes(search));
  const pg = UI.paginate(filtered, page, 24);

  if (!document.getElementById('foto-search')) {
    el.innerHTML = `
      <div class="filters-row" style="margin-bottom:20px;">
        <div class="search-box" style="flex:1;max-width:320px;">
          <span class="search-box__icon">🔍</span>
          <input type="text" id="foto-search" class="form-control" placeholder="Filtrar por agente..." oninput="page=1;renderGallery()">
        </div>
        <span style="color:var(--text-muted);font-size:0.85rem;">${filtered.length} foto${filtered.length !== 1 ? 's' : ''}</span>
      </div>
      <div id="foto-grid"></div>
      <div id="foto-pagination"></div>`;
  }

  const grid = document.getElementById('foto-grid');
  const pag = document.getElementById('foto-pagination');
  if (!grid) return;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state__icon">🖼</div><div class="empty-state__title">Sem fotos</div><div class="empty-state__text">As fotos aparecem aqui após submissão de auditorias.</div></div>`;
    pag.innerHTML = '';
    return;
  }

  grid.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;">
    ${pg.items.map((p, i) => `
      <div class="photo-card" onclick="openLightbox(${(page-1)*24 + i}, filtered_arr)">
        <div class="photo-card__img"><img src="${p.url}" loading="lazy" alt="${p.agente || 'foto'}"></div>
        <div class="photo-card__info">
          <div style="font-size:0.8rem;font-weight:600;">${p.agente || '—'}</div>
          <div class="photo-card__date">${UI.formatDate(p.data)}</div>
        </div>
      </div>`).join('')}
  </div>`;

  // Attach click with proper data
  grid.querySelectorAll('.photo-card').forEach((card, i) => {
    card.onclick = () => openLightbox(pg.items[i]);
  });

  UI.renderPagination(pag, page, pg.pages, p => { page = p; renderGallery(); });
}

const obs = new MutationObserver(() => {
  if (document.getElementById('page-content')) { obs.disconnect(); renderGallery(); }
});
obs.observe(document.getElementById('app'), { childList: true, subtree: true });

function openLightbox(photo) {
  document.getElementById('lightbox-img').src = photo.url;
  document.getElementById('lightbox-info').textContent = `${photo.agente || '—'} · ${UI.formatDate(photo.data)}`;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
</script>
</body>
</html>
