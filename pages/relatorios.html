<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = 'https://udmlzpvpsllitrhxejvj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkbWx6cHZwc2xsaXRyaHhlanZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjAyMzEsImV4cCI6MjA5NjQ5NjIzMX0.YK8IxVwt2-cqXRV1nGHLNsHZsvSflcTb1tpUY2dJ0pQ';
const APP_VERSION = '1.0.0';
const APP_NAME = 'SupervisãoAgentes';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async () => {
  const ok = await Auth.init();
  if (!ok) { window.location.href = '../index.html'; return; }
  if (!Auth.isAdmin()) { window.location.href = 'auditorias.html'; return; }
  renderLayout('nav-relatorios', 'Relatórios');
  await loadReports();
})();

async function loadReports() {
  UI.loading(true);
  try {
    const [
      { data: auditorias },
      { data: agentes },
      { count: totalAgentes },
      { count: totalSups }
    ] = await Promise.all([
      Auth.sb().from('auditorias').select('*, agentes(nome, zona), profiles(full_name)').order('created_at', { ascending: false }),
      Auth.sb().from('agentes').select('status'),
      Auth.sb().from('agentes').select('*', { count: 'exact', head: true }),
      Auth.sb().from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'supervisor'),
    ]);

    const all = auditorias || [];
    const aprovadas = all.filter(a => a.status === 'aprovado');
    const pendentes = all.filter(a => a.status === 'pendente');
    const reprovadas = all.filter(a => a.status === 'reprovado');
    const avgRating = all.filter(a => a.avaliacao).reduce((s, a) => s + a.avaliacao, 0) / (all.filter(a => a.avaliacao).length || 1);

    // By supervisor
    const bySup = {};
    all.forEach(a => {
      const name = a.profiles?.full_name || 'Desconhecido';
      if (!bySup[name]) bySup[name] = { total: 0, aprovadas: 0, pendentes: 0 };
      bySup[name].total++;
      if (a.status === 'aprovado') bySup[name].aprovadas++;
      if (a.status === 'pendente') bySup[name].pendentes++;
    });

    // By month (last 6)
    const byMonth = {};
    all.forEach(a => {
      const m = a.data_visita ? a.data_visita.slice(0, 7) : null;
      if (m) byMonth[m] = (byMonth[m] || 0) + 1;
    });
    const months = Object.entries(byMonth).sort().slice(-6);

    renderReports({ all, aprovadas, pendentes, reprovadas, avgRating, bySup, months, totalAgentes, totalSups, agentes: agentes || [] });
  } catch(e) {
    UI.toast('Erro: ' + e.message, 'error');
  } finally {
    UI.loading(false);
  }
}

function renderReports({ all, aprovadas, pendentes, reprovadas, avgRating, bySup, months, totalAgentes, totalSups, agentes }) {
  const el = document.getElementById('page-content');
  if (!el) return;

  const ativos = agentes.filter(a => a.status === 'ativo').length;
  const maxBar = Math.max(...months.map(([,v]) => v), 1);

  el.innerHTML = `
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:20px;">
      <button class="btn btn--ghost btn--sm" onclick="exportAll()">⬇ Exportar Tudo CSV</button>
    </div>

    <div class="stats-grid" style="margin-bottom:24px;">
      <div class="stat-card stat-card--blue"><div class="stat-card__glow"></div><div class="stat-card__icon">📋</div><div class="stat-card__value">${all.length}</div><div class="stat-card__label">Total Auditorias</div></div>
      <div class="stat-card stat-card--green"><div class="stat-card__glow"></div><div class="stat-card__icon">✓</div><div class="stat-card__value">${aprovadas.length}</div><div class="stat-card__label">Aprovadas</div></div>
      <div class="stat-card stat-card--amber"><div class="stat-card__glow"></div><div class="stat-card__icon">⏳</div><div class="stat-card__value">${pendentes.length}</div><div class="stat-card__label">Pendentes</div></div>
      <div class="stat-card stat-card--pink"><div class="stat-card__glow"></div><div class="stat-card__icon">★</div><div class="stat-card__value">${avgRating.toFixed(1)}</div><div class="stat-card__label">Avaliação Média</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="rep-grid">
      <!-- Monthly chart -->
      <div class="card">
        <div class="card__header"><span class="card__title">Auditorias por Mês</span></div>
        <div class="card__body">
          <div style="display:flex;align-items:flex-end;gap:10px;height:140px;">
            ${months.map(([m, v]) => `
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span style="font-size:0.7rem;color:var(--text-muted);">${v}</span>
                <div style="width:100%;height:${Math.round((v/maxBar)*110)}px;background:linear-gradient(180deg,var(--blue-light),var(--blue));border-radius:4px 4px 0 0;min-height:4px;"></div>
                <span style="font-size:0.65rem;color:var(--text-muted);">${m.slice(5)}</span>
              </div>`).join('') || '<div style="color:var(--text-muted);font-size:0.85rem;">Sem dados</div>'}
          </div>
        </div>
      </div>

      <!-- Status donut (simple) -->
      <div class="card">
        <div class="card__header"><span class="card__title">Por Estado</span></div>
        <div class="card__body">
          ${[
            ['Aprovadas', aprovadas.length, '#10b981'],
            ['Pendentes', pendentes.length, '#f59e0b'],
            ['Reprovadas', reprovadas.length, '#ef4444'],
          ].map(([label, n, color]) => {
            const pct = all.length ? Math.round((n/all.length)*100) : 0;
            return `<div style="margin-bottom:14px;">
              <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:5px;">
                <span>${label}</span><span style="font-weight:600;">${n} (${pct}%)</span>
              </div>
              <div style="height:6px;background:rgba(255,255,255,0.06);border-radius:99px;">
                <div style="height:6px;width:${pct}%;background:${color};border-radius:99px;transition:width 0.5s;"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <!-- By supervisor table -->
    <div class="card" style="margin-top:20px;">
      <div class="card__header"><span class="card__title">Desempenho por Supervisor</span></div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>Supervisor</th>
            <th>Total Auditorias</th>
            <th>Aprovadas</th>
            <th>Pendentes</th>
            <th>Taxa Aprovação</th>
          </tr></thead>
          <tbody>
            ${Object.entries(bySup).sort((a,b) => b[1].total - a[1].total).map(([name, s]) => {
              const taxa = s.total ? Math.round((s.aprovadas/s.total)*100) : 0;
              return `<tr>
                <td>
                  <div class="table-agent">
                    <div class="table-avatar">${UI.initials(name)}</div>
                    <div class="table-name">${name}</div>
                  </div>
                </td>
                <td>${s.total}</td>
                <td><span class="badge badge--success">${s.aprovadas}</span></td>
                <td><span class="badge badge--warning">${s.pendentes}</span></td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <div style="flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:99px;width:80px;">
                      <div style="height:5px;width:${taxa}%;background:${taxa >= 70 ? '#10b981' : taxa >= 40 ? '#f59e0b' : '#ef4444'};border-radius:99px;"></div>
                    </div>
                    <span style="font-size:0.8rem;">${taxa}%</span>
                  </div>
                </td>
              </tr>`;
            }).join('') || '<tr><td colspan="5"><div class="empty-state">Sem dados</div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;

  const style = document.createElement('style');
  style.textContent = '@media(max-width:700px){.rep-grid{grid-template-columns:1fr!important}}';
  document.head.appendChild(style);

  window._allAuditData = all;
}

const obs = new MutationObserver(() => {
  if (document.getElementById('page-content')) { obs.disconnect(); loadReports(); }
});
obs.observe(document.getElementById('app'), { childList: true, subtree: true });

function exportAll() {
  if (!window._allAuditData) return;
  const rows = window._allAuditData.map(a => ({
    Agente: a.agentes?.nome || '', Zona: a.agentes?.zona || '',
    Supervisor: a.profiles?.full_name || '',
    Data: UI.formatDate(a.data_visita), Avaliacao: a.avaliacao || '',
    Estado: a.status, Observacoes: a.observacoes || ''
  }));
  exportToCSV(rows, `relatorio_auditorias_${new Date().toISOString().split('T')[0]}.csv`);
}
</script>
</body>
</html>
