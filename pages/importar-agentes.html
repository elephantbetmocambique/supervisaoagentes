// ============================================================
// CSV PARSING
// ============================================================

function handleFile(file) {
  if (!file) return;
  if (!file.name.match(/\.(csv|txt)$/i)) {
    UI.toast('Por favor carregue um ficheiro .csv', 'warning');
    return;
  }

  const reader = new FileReader();
  reader.onload = e => parseCSV(e.target.result);
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  // Normalizar quebras de linha
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
  if (lines.length < 2) { UI.toast('Ficheiro vazio ou sem dados', 'warning'); return; }

  // Parse cabeçalho
  const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remover acentos
    .replace(/\s+/g, '_'));

  const nomeIdx = headers.indexOf('nome');
  if (nomeIdx === -1) {
    UI.toast('Coluna "nome" não encontrada. Verifique o cabeçalho do CSV.', 'error');
    return;
  }

  parsedRows = [];
  const seen = new Set();

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const get = key => {
      const idx = headers.indexOf(key);
      return idx >= 0 ? (cols[idx] || '').trim() : '';
    };

    const nome = get('nome');
    if (!nome) { parsedRows.push({ _error: 'Nome vazio', _line: i + 1 }); continue; }

    const isDuplicate = seen.has(nome.toLowerCase());
    seen.add(nome.toLowerCase());

    parsedRows.push({
      nome,
      codigo: get('codigo') || get('id_agente') || null,
      telefone: get('telefone') || null,
      email: get('email') || null,
      zona: get('zona') || null,
      data_inicio: get('data_inicio') || null,
      status: ['ativo','inativo'].includes(get('status')) ? get('status') : 'ativo',
      _line: i + 1,
      _duplicate: isDuplicate,
      _error: null,
    });
  }

  renderPreview();
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(current); current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

function renderPreview() {
  const valid = parsedRows.filter(r => !r._error && !r._duplicate);
  const errors = parsedRows.filter(r => r._error);
  const duplicates = parsedRows.filter(r => r._duplicate);

  document.getElementById('preview-section').style.display = 'block';
  document.getElementById('preview-count').textContent = `${parsedRows.length} linha${parsedRows.length !== 1 ? 's' : ''} encontrada${parsedRows.length !== 1 ? 's' : ''}`;

  document.getElementById('import-stats').innerHTML = `
    <div class="import-stat">
      <div class="import-stat__dot" style="background:#34d399;"></div>
      <span>${valid.length} prontos para importar</span>
    </div>
    ${duplicates.length ? `<div class="import-stat">
      <div class="import-stat__dot" style="background:#f59e0b;"></div>
      <span>${duplicates.length} duplicado${duplicates.length !== 1 ? 's' : ''} (serão ignorados)</span>
    </div>` : ''}
    ${errors.length ? `<div class="import-stat">
      <div class="import-stat__dot" style="background:#f87171;"></div>
      <span>${errors.length} erro${errors.length !== 1 ? 's' : ''}</span>
    </div>` : ''}`;

  document.getElementById('preview-tbody').innerHTML = parsedRows.slice(0, 100).map(r => {
    const rowClass = r._error ? 'import-row--error' : r._duplicate ? 'import-row--duplicate' : 'import-row--ok';
    return `<tr class="${rowClass}">
      <td style="color:var(--text-muted);font-size:0.75rem;">${r._line}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="table-avatar" style="width:28px;height:28px;font-size:0.65rem;flex-shrink:0;">${UI.initials(r.nome || '?')}</div>
          <span style="font-weight:500;">${r.nome || '—'}</span>
        </div>
      </td>
      <td class="table-hide-mobile">${r.codigo || '—'}</td>
      <td>${r.telefone || '—'}</td>
      <td class="table-hide-mobile">${r.zona || '—'}</td>
      <td>
        ${r._error ? `<span class="badge badge--danger" title="${r._error}">Erro</span>` :
          r._duplicate ? `<span class="badge badge--warning">Duplicado</span>` :
          `<span class="badge badge--success">OK</span>`}
      </td>
    </tr>`;
  }).join('');

  if (parsedRows.length > 100) {
    document.getElementById('preview-tbody').innerHTML += `
      <tr><td colspan="6" style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:12px;">
        ... e mais ${parsedRows.length - 100} linhas
      </td></tr>`;
  }

  document.getElementById('btn-import').textContent = `⬆ Importar ${valid.length} Agente${valid.length !== 1 ? 's' : ''}`;
  document.getElementById('btn-import').disabled = valid.length === 0;
}

function clearFile() {
  parsedRows = [];
  document.getElementById('preview-section').style.display = 'none';
  document.getElementById('csv-input').value = '';
  document.getElementById('progress-card').style.display = 'none';
}

// ============================================================
// IMPORTAÇÃO
// ============================================================

async function startImport() {
  if (importing) return;
  const valid = parsedRows.filter(r => !r._error && !r._duplicate);
  if (!valid.length) { UI.toast('Sem agentes válidos para importar', 'warning'); return; }

  const ok = await UI.confirm(
    'Confirmar Importação',
    `Vai importar ${valid.length} agente${valid.length !== 1 ? 's' : ''}${selectedSupervisor ? ' com supervisor atribuído' : ''}. Continuar?`
  );
  if (!ok) return;

  importing = true;
  document.getElementById('progress-card').style.display = 'block';
  document.getElementById('import-result').style.display = 'none';
  document.getElementById('btn-import').disabled = true;

  let success = 0, failed = 0, failedNames = [];
  const batchSize = 20;

  for (let i = 0; i < valid.length; i += batchSize) {
    const batch = valid.slice(i, i + batchSize).map(r => ({
      nome: r.nome,
      codigo: r.codigo,
      telefone: r.telefone,
      email: r.email,
      zona: r.zona,
      data_inicio: r.data_inicio,
      status: r.status || 'ativo',
      supervisor_id: selectedSupervisor || null,
    }));

    try {
      const { data, error } = await Auth.sb()
        .from('agentes')
        .insert(batch)
        .select();

      if (error) {
        failed += batch.length;
        failedNames.push(...batch.map(b => b.nome));
        console.error('Batch error:', error);
      } else {
        success += (data || batch).length;
      }
    } catch(e) {
      failed += batch.length;
      console.error('Batch exception:', e);
    }

    // Actualizar progresso
    const done = Math.min(i + batchSize, valid.length);
    const pct = Math.round((done / valid.length) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${done} / ${valid.length} agentes processados`;
    document.getElementById('progress-title').textContent = pct < 100 ? `A importar... ${pct}%` : 'Importação concluída!';

    // Pequena pausa entre batches para não sobrecarregar
    await new Promise(r => setTimeout(r, 100));
  }

  importing = false;
  document.getElementById('import-result').style.display = 'block';
  document.getElementById('result-stats').innerHTML = `
    <div class="import-stat">
      <div class="import-stat__dot" style="background:#34d399;"></div>
      <span style="color:#34d399;font-size:0.95rem;">${success} agente${success !== 1 ? 's' : ''} importado${success !== 1 ? 's' : ''} com sucesso</span>
    </div>
    ${failed ? `<div class="import-stat">
      <div class="import-stat__dot" style="background:#f87171;"></div>
      <span style="color:#f87171;">${failed} falharam</span>
    </div>` : ''}`;

  if (success > 0) UI.toast(`${success} agentes importados!`, 'success');
  if (failed > 0) UI.toast(`${failed} agentes falharam.`, 'error');
}

function resetImport() {
  parsedRows = [];
  importing = false;
  document.getElementById('preview-section').style.display = 'none';
  document.getElementById('progress-card').style.display = 'none';
  document.getElementById('csv-input').value = '';
  document.getElementById('btn-import').disabled = false;
}

function downloadTemplate() {
  const csv = 'nome,codigo,telefone,email,zona,data_inicio,status\n';
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'modelo_agentes.csv'; a.click();
  URL.revokeObjectURL(url);
}
