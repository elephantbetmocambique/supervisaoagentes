<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe Auditoria — SupervisãoAgentes</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app"></div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img class="lightbox__img" id="lightbox-img" src="">
  <button class="lightbox__close">✕</button>
</div>

<script>
const SUPABASE_URL = 'https://udmlzpvpsllitrhxejvj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkbWx6cHZwc2xsaXRyaHhlanZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjAyMzEsImV4cCI6MjA5NjQ5NjIzMX0.YK8IxVwt2-cqXRV1nGHLNsHZsvSflcTb1tpUY2dJ0pQ';
const APP_VERSION = '1.0.0';
const APP_NAME = 'SupervisãoAgentes';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');

(async () => {
  const ok = await Auth.init();
  if (!ok) { window.location.href = '../index.html'; return; }
  renderLayout('nav-auditorias', 'Detalhe da Auditoria');

  if (!id) { document.getElementById('page-content').innerHTML = '<div class="empty-state"><div class="empty-state__icon">⚠</div><div class="empty-state__title">ID não encontrado</div></div>'; return; }

  UI.loading(true);
  try {
    const { data, error } = await Auth.sb().from('auditorias')
      .select('*, agentes(nome, foto_url, zona, telefone, bi), profiles(full_name)')
      .eq('id', id).single();
    if (error) throw error;
    renderDetail(data);
  } catch(e) {
    document.getElementById('page-content').innerHTML = `<div class="empty-state"><div class="empty-state__icon">⚠</div><div class="empty-state__title">Erro: ${e.message}</div></div>`;
  } finally {
    UI.loading(false);
  }
})();

function renderDetail(a) {
  const checklist = a.checklist || {};
  const fotos = a.fotos || [];

  const checkItem = (key, label) => {
    const val = checklist[key];
    const color = val === 'sim' || val === 'bom' ? '#34d399' : val === 'nao' || val === 'mau' ? '#f87171' : '#fbbf24';
    const icon = val === 'sim' || val === 'bom' ? '✓' : val === 'nao' || val === 'mau' ? '✕' : '–';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:0.875rem;">${label}</span>
      <span style="font-size:0.8rem;font-weight:600;color:${color};">${icon} ${val ? val.charAt(0).toUpperCase() + val.slice(1) : '—'}</span>
    </div>`;
  };

  const stars = Array.from({length: 5}, (_,i) =>
    `<span style="color:${i < (a.avaliacao||0) ? '#fbbf24' : 'var(--gray-600)'}; font-size:1.4rem;">★</span>`).join('');

  document.getElementById('topbar-actions').innerHTML = `
    <a href="auditorias.html" class="btn btn--ghost btn--sm">← Voltar</a>
    ${Auth.isAdmin() && a.status === 'pendente' ? `
      <button class="btn btn--primary btn--sm" onclick="changeStatus('aprovado')">✓ Aprovar</button>
      <button class="btn btn--danger btn--sm" onclick="changeStatus('reprovado')">✕ Reprovar</button>` : ''}`;

  document.getElementById('page-content').innerHTML = `
    <div style="display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;" class="detail-grid">
      <!-- Left: Agente card -->
      <div>
        <div class="card card--elevated" style="text-align:center;padding:24px;">
          <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--pink));display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:white;margin:0 auto 14px;overflow:hidden;">
            ${a.agentes?.foto_url ? `<img src="${a.agentes.foto_url}" style="width:100%;height:100%;object-fit:cover;">` : UI.initials(a.agentes?.nome || '?')}
          </div>
          <div style="font-size:1.1rem;font-weight:700;">${a.agentes?.nome || '—'}</div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">${a.agentes?.zona || '—'}</div>
          ${a.agentes?.telefone ? `<div style="font-size:0.85rem;margin-top:8px;">📞 ${a.agentes.telefone}</div>` : ''}
          ${a.agentes?.bi ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">BI: ${a.agentes.bi}</div>` : ''}
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="card__body">
            <div style="font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;">Detalhes</div>
            <div style="display:flex;flex-direction:column;gap:10px;font-size:0.85rem;">
              <div><span style="color:var(--text-muted);">Supervisor</span><br><strong>${a.profiles?.full_name || '—'}</strong></div>
              <div><span style="color:var(--text-muted);">Data da visita</span><br><strong>${UI.formatDate(a.data_visita)} ${a.hora_visita || ''}</strong></div>
              <div><span style="color:var(--text-muted);">Localização</span><br><strong>${a.localizacao || '—'}</strong></div>
              <div><span style="color:var(--text-muted);">Estado</span><br>${UI.statusBadge(a.status)}</div>
              <div><span style="color:var(--text-muted);">Submetida em</span><br><strong>${UI.formatDateTime(a.created_at)}</strong></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Audit details -->
      <div>
        <!-- Rating -->
        <div class="card" style="margin-bottom:16px;">
          <div class="card__header"><span class="card__title">Avaliação Geral</span></div>
          <div class="card__body">
            <div style="display:flex;align-items:center;gap:12px;">
              <div>${stars}</div>
              <span style="font-size:1.5rem;font-weight:700;">${a.avaliacao || '—'}<span style="font-size:0.9rem;color:var(--text-muted);font-weight:400;">/5</span></span>
            </div>
          </div>
        </div>

        <!-- Checklist -->
        <div class="card" style="margin-bottom:16px;">
          <div class="card__header"><span class="card__title">Condições Operacionais</span></div>
          <div class="card__body">
            ${checkItem('uniforme', 'Uniforme / Farda')}
            ${checkItem('material', 'Material de Trabalho')}
            ${checkItem('ponto_ativo', 'Ponto de Venda Ativo')}
            ${checkItem('comunicacao', 'Comunicação / Sinal')}
            ${checkItem('horario', 'Cumprimento de Horário')}
            ${checkItem('atendimento', 'Atendimento ao Cliente')}
          </div>
        </div>

        <!-- Observações -->
        ${a.observacoes ? `<div class="card" style="margin-bottom:16px;">
          <div class="card__header"><span class="card__title">Observações</span></div>
          <div class="card__body"><p style="font-size:0.875rem;line-height:1.7;color:var(--text-secondary);">${a.observacoes}</p></div>
        </div>` : ''}

        <!-- Fotos -->
        <div class="card">
          <div class="card__header"><span class="card__title">Fotografias (${fotos.length})</span></div>
          <div class="card__body">
            ${fotos.length ? `<div class="photo-gallery">
              ${fotos.map(url => `
                <div class="photo-card" onclick="openLightbox('${url}')">
                  <div class="photo-card__img"><img src="${url}" loading="lazy"></div>
                </div>`).join('')}
            </div>` : '<div class="empty-state" style="padding:24px 0;"><div class="empty-state__icon">🖼</div><div class="empty-state__text">Sem fotografias</div></div>'}
          </div>
        </div>
      </div>
    </div>`;

  const style = document.createElement('style');
  style.textContent = '@media(max-width:700px){.detail-grid{grid-template-columns:1fr!important}}';
  document.head.appendChild(style);
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('active');
}

async function changeStatus(status) {
  const { error } = await Auth.sb().from('auditorias').update({ status }).eq('id', id);
  if (error) { UI.toast('Erro: ' + error.message, 'error'); return; }
  UI.toast(status === 'aprovado' ? 'Aprovada!' : 'Reprovada.', 'success');
  location.reload();
}
</script>
</body>
</html>
